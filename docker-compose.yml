version: "3.8"

services:
  frontend:
    build: 
      context: ./frontend/resume-analyzer-react
    ports:
      - "5173:5173"
    depends_on:
      - auth_backend
      - genai_backend
    volumes:
      - ./frontend/resume-analyzer-react:/app
      - /app/node_modules

  auth_backend:
    build: 
      context: ./backend/analyzer_auth_nodejs
    ports:
      - "8080:8080"
    env_file:
      - ./backend/analyzer_auth_nodejs/.env
    volumes:
      - ./backend/analyzer_auth_nodejs:/app
      - /app/node_modules

  genai_backend:
    build: 
      context: ./backend/analyzer_genai_fastapi
    ports:
      - "8000:8000"
    env_file:
      - ./backend/analyzer_genai_fastapi/.env
    volumes:
      - ./backend/analyzer_genai_fastapi:/app



